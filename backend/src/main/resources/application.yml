server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  config:
    import: ["optional:file:./application-local.yml", "optional:file:../application-local.yml"]
  application:
    name: teach-eval
    
  # 【这里是合并过来的文件上传大小限制配置】
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/teach_eval?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000   # 24小时(ms)
  refresh-expiration: 604800000  # 7天(ms)
  token-header: Authorization
  token-prefix: "Bearer "

# Knife4j API文档
knife4j:
  enable: true
  setting:
    language: zh_cn

# NLP 情感分析微服务
nlp:
  service:
    url: ${NLP_SERVICE_URL:http://localhost:5001}

# 文件上传保存路径
file:
  upload-path: ${UPLOAD_PATH:./uploads}

# 日志
logging:
  level:
    com.bishe.teach.mapper: debug
    org.springframework.security: info
